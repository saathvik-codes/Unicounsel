name: Refresh live data snapshot
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python backend/scripts/refresh_snapshot.py
      - name: Commit if changed
        run: |
          git config user.name "data-refresh"
          git config user.email "data-refresh@users.noreply.github.com"
          git add backend/data/live_snapshot.json
          git diff --cached --quiet || (git commit -m "Refresh live data snapshot" && git push)

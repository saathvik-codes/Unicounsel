{% extends "auth_base.html" %}
{% block title %}Sign in - UniCounsel{% endblock %}

{% block form %}
  <h1>Welcome back</h1>
  <p class="lede">Sign in to pick up your shortlist.</p>

  <form method="POST">
    <label class="field">
      <span>Email</span>
      <span class="control">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
        <input type="email" name="email" autocomplete="email" inputmode="email" placeholder="you@example.com" required autofocus>
      </span>
    </label>

    <label class="field">
      <span>Password</span>
      <span class="control">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        <input type="password" name="password" autocomplete="current-password" placeholder="Your password" required>
        <button type="button" class="reveal" aria-label="Show password" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </span>
    </label>

    <button class="btn btn-primary" type="submit">Sign in</button>
    <div class="or">or</div>
    <a class="btn btn-ghost" href="{{ url_for('google_login') }}">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.56c2.08-1.92 3.28-4.74 3.28-8.1Z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.56-2.77c-.98.66-2.23 1.06-3.72 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23Z"/><path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84Z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.2 1.64l3.15-3.15A10.6 10.6 0 0 0 12 1 11 11 0 0 0 2.18 7.06l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38Z"/></svg>
      Continue with Google
    </a>
  </form>

  <p class="switch">New to UniCounsel? <a href="{{ url_for('signup') }}">Create an account</a></p>
{% endblock %}

{% block slides %}
  <figure class="slide" data-caption="Welcome back. Your shortlist is where you left it."><img src="{{ url_for('static', filename='illustrations/uc-auth-signin.webp') }}" alt="" width="640" height="640"></figure>
  <figure class="slide" data-caption="Programmes ranked against your grades, budget and preferred countries."><img src="{{ url_for('static', filename='illustrations/uc-carousel-match.webp') }}" alt="" width="640" height="640" loading="lazy"></figure>
  <figure class="slide" data-caption="A checklist for each visa, and a rough read on your chances."><img src="{{ url_for('static', filename='illustrations/uc-carousel-visa.webp') }}" alt="" width="640" height="640" loading="lazy"></figure>
  <figure class="slide" data-caption="Tuition and living costs added up before you apply."><img src="{{ url_for('static', filename='illustrations/uc-carousel-money.webp') }}" alt="" width="640" height="640" loading="lazy"></figure>
{% endblock %}
